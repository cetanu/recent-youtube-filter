<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recent YouTube Filter</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <form id="options-form">
      <label for="max-age-days">Hide videos older than</label>
      <div class="field-row">
        <input id="max-age-days" name="maxAgeDays" type="number" min="0" max="3650" step="1" required>
        <span>days</span>
      </div>
      <label class="checkbox-row" for="hide-shorts-panel">
        <input id="hide-shorts-panel" name="hideShortsPanel" type="checkbox">
        <span>Hide the Shorts panel</span>
      </label>
      <label class="checkbox-row" for="hide-podcast-links">
        <input id="hide-podcast-links" name="hidePodcastLinks" type="checkbox">
        <span>Hide podcast links labelled “View full podcast” or “Personalised mix for you”</span>
      </label>
      <button type="submit">Save</button>
      <p id="status" role="status"></p>
    </form>
    <script src="options.js"></script>
  </body>
</html>
